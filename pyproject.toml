[build-system]
requires = [
    "hatchling>=0.21.1",
]
build-backend = "hatchling.build"

[project]
name = "backrefs"
description = "A wrapper around re and regex that adds additional back references."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Isaac Muse", email = "Isaac.Muse@gmail.com" },
]
keywords = [
    "regex",
    "re"
]
dynamic = [
    "classifiers",
    "version"
]

[project.optional-dependencies]
extras = [
    "regex"
]

[project.urls]
Homepage = "https://github.com/facelessuser/backrefs"

[tool.hatch.version]
source = "code"
path = "backrefs/__meta__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/docs/src/markdown/**/*.md",
    "/docs/src/markdown/**/*.gif",
    "/docs/src/markdown/**/*.png",
    "/docs/src/markdown/dictionary/*.txt",
    "/docs/theme/**/*.css",
    "/docs/theme/**/*.js",
    "/docs/theme/**/*.html",
    "/requirements/*.txt",
    "/backrefs/**/*.py",
    "/backrefs/py.typed",
    "/tests/**/*.py",
    "/tools/**/*.py",
    "/tools/unicodedata/*.zip",
    "/tools/unicodedata/LICENSE",
    "/.pyspelling.yml",
    "/.coveragerc",
    "/mkdocs.yml"
]

exclude = [
    "backrefs/uniprops/unidata/*"
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
include = [
    "/backrefs"
]

[tool.hatch.build.hooks.custom]
[tool.hatch.metadata.hooks.custom]

[tool.mypy]
files = [
    "backrefs"
]
strict = true
show_error_codes = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    'backrefs.uniprops.*',
    'backrefs._bregex_typing'
]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = 'backrefs.uniprops.*'
implicit_reexport = true

[tool.ruff]
line-length = 120

extend-exclude = [
    "backrefs/uniprops/unidata/*"
]

lint.select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "E",    # pycodestyle
    "F",    # pyflakes
    "PGH",  # pygrep-hooks
    "RUF",  # ruff
    # "UP",   # pyupgrade
    "W",    # pycodestyle
    "YTT",  # flake8-2020,
    "PERF"  # Perflint
]

lint.ignore = [
    "B034",
    "E741",
    "D202",
    "D401",
    "D212",
    "D203",
    "N802",
    "N801",
    "N803",
    "N806",
    "N818",
    "RUF012",
    "RUF005",
    "PGH004",
    "RUF022",
    "RUF023",
    "RUF100"
]

[tool.hatch.envs.dev]
dependencies = [
    "pytest",
    "pytest-cov",
    "coverage",
    "mypy",
    "ruff",
    "build",
    "regex"
]

[tool.hatch.envs.docs]
dependencies = [
    "zensical",
    "markdown",
    "pymdown-extensions",
    "zensical-pymdownx @ git+https://github.com/facelessuser/pymdownx-zensical-theme.git",
    "pymdown_lexers @ git+https://github.com/facelessuser/pymdown-lexers.git",
    "pyspelling",
    "build",
    "python-minifier",
    "regex"
]

[[tool.hatch.envs.dev.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

[[tool.hatch.envs.dev-stdlib.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.dev.scripts]
types = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
mypy
"""
tests = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
pytest --cov backrefs --cov-append --cov-report term-missing --cov-report xml --cov-report html:.cov tests
"""
lint = 'ruff check .'

[tool.hatch.envs.dev-stdlib.scripts]
tests = "pytest --cov pymdownx --cov-append --cov-report term-missing --cov-report xml --cov-report html:.cov tests"

[tool.hatch.envs.docs.scripts]
spellcheck = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
python -m zensical.main build -f zensical.yml --clean --strict; pyspelling -j 8
"""
clean = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
python -m zensical.main build -f zensical.yml --clean
"""
serve = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
python -m zensical.main serve -f zensical.yml
"""
build = """
python tools/unidatadownload.py && \
python tools/unipropgen.py backrefs/uniprops/unidata && \
python -m zensical.main build -f zensical.yml --clean
"""